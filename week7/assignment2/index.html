<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form method="GET">
        <div>
            <label>Username</label>
            <br>
            <input type="text" name="username" placeholder="enter your username" autofocus minlength="5" maxlength="20">
        </div>
        <br>

        <div>
            <label>Email</label>
            <br>
            <input type="email" name="email" placeholder="enter your email" value="o@o.com" readonly>
        </div>
        <br>

        <div>
            
            <input type="text" name="token"  value="b92f1fc2fce391ad7af633723afd3055" hidden>
        </div>
        <hr>

         <div>
            <label>skills</label>
            <br>
            <div>
                <input type="checkbox" id="Problem-Solving">
                <label for="Problem-Solving">Problem Solving</label>
            </div>
           <div>
                <input type="checkbox" id="Logical-Thinking">
                <label for="Logical-Thinking">Logical Thinking</label>
            </div>
            <div>
                <input type="checkbox" id="Advanced-Search">
                <label for="Advanced-Search">Advanced Search</label>
            </div>
            <div>
                <input type="checkbox" id="Analysis">
                <label for="Analysis">Analysis</label>
            </div>
           <div>
                <input type="checkbox" id="Planning">
                <label for="Planning"> Planning</label>
            </div>
        </div>

        <hr>
        <div>
            <label>job</label>
            <br>
            <div>
                <input type="radio" name="Job" id="Front-End">
                <label for="Front-End">Front-End Developer</label>
            </div>
            <div>
                <input type="radio" name="Job" id="Back-End">
                <label for="Back-End">Back-End Developer</label>
            </div>
            <div>
                <input type="radio" name="Job" id="Business-Analyst">
                <label for="Business-Analyst">Business Analyst</label>
            </div>
            <div>
                <input type="radio" name="Job" id="Project-Manager">
                <label for="Project-Manager">Project Manager</label>
            </div>
            <div>
                <input type="radio" name="Job" id="Scrum-Master">
                <label for="Scrum-Master">Scrum Master</label>
            </div>
        </div>
        <br>


        <input type="submit" value="Send">
        <input type="reset" value="Empty">

    </form>
</body>
</html>
