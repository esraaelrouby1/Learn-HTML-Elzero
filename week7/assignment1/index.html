<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form method="GET">
        <div>
            <label>Username</label>
            <br>
            <input type="text" name="username" placeholder="enter your username" autofocus minlength="5" maxlength="20">
        </div>
        <br>

        <div>
            <label>Email</label>
            <br>
            <input type="email" name="email" placeholder="enter your email" value="o@o.com" readonly>
        </div>
        <br>

        <div>
            
            <input type="text" name="token"  value="b92f1fc2fce391ad7af633723afd3055" hidden>
        </div>
        <br>
        <input type="submit" value="Send">
        <input type="reset" value="Empty">

    </form>
</body>
</html>
