<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form action="" method="post">
        <div>
            <label>Username</label>
            <br>
            <input type="text" required placeholder="Enter your username" name="username">
        </div>
        <hr>
        <div>
            <label>Password</label>
            <br>
            <input type="password" placeholder="Enter a strong password" name="password">
        </div>
        <hr>
        <div>
            <label>Mobile</label>
            <br>
            <input type="tel" name="phone" placeholder="+20100 (234) 123" pattern="\+20100\s\(\d{3}\)\s\d{3}">
        </div>
        <hr>
        <div>
            <label>Email</label>
            <br>
            <input type="email" required placeholder="Write A Valid Email" name="email">
        </div>
        <hr>
        <div>
            <label>Subject</label>
            <br>
            <input type="text" name="subject" placeholder="Write whatever you like.">
        </div>
        <hr>

        <input type="hidden" value="123" name="id">
        <br>
        <input type="reset" value="Empty Form">
        <input type="submit" value="Send Data">
    </form>
</body>
</html>
